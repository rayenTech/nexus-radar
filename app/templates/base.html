<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nexus Radar — open-source research and technology intelligence.">
  <title>{% block title %}Nexus Radar{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
  <div class="container-fluid px-lg-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('main.dashboard') }}">
      <span class="brand-mark">N</span><span>NEXUS <span class="brand-light">RADAR</span></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="navbar-nav ms-auto gap-lg-2">
        <a class="nav-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}" href="{{ url_for('main.dashboard') }}">Overview</a>
        <a class="nav-link {% if request.endpoint == 'main.research' %}active{% endif %}" href="{{ url_for('main.research') }}">Research</a>
        <a class="nav-link {% if request.endpoint == 'main.news' %}active{% endif %}" href="{{ url_for('main.news') }}">Technology News</a>
        <a class="nav-link {% if request.endpoint == 'main.trends' %}active{% endif %}" href="{{ url_for('main.trends') }}">Trends</a>
        <a class="nav-link" href="https://github.com/" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
    </div>
  </div>
</nav>
<main class="container-fluid px-3 px-lg-4 py-4 app-main">
  {% block content %}{% endblock %}
</main>
<footer class="footer mt-5 py-4">
  <div class="container-fluid px-lg-4 d-flex flex-column flex-md-row justify-content-between gap-2">
    <span> <strong>Nexus Radar</strong> · Open-source research & technology intelligence</span>
    <span>Content belongs to its original publishers. Always consult the source.</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
