name: Collect research and technology updates

on:
  schedule:
    # Every two hours at minute 23 (UTC). Avoid the top of the hour.
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect and store new items
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          COLLECTION_LOOKBACK_DAYS: "7"
          COLLECT_LIMIT: "30"
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing DATABASE_URL repository secret."
            exit 1
          fi
          python -m collector.run
